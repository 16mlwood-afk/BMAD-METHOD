# .githooks/gates.conf — registry of which ./scripts gates run at which git event.
#
# Format:  <event>\t<command-relative-to-repo-root>
#   event  = pre-push | pre-commit
#   command runs from the repo root; a command whose script is ABSENT in this
#   repo is silently skipped, so this file may list the full fleet gate set.
#
# Adding a PROJECT gate is a one-line edit here — the .githooks/ entrypoints are
# generic dispatchers and never need editing. Bypass any gate with --no-verify (logged).
#
# This file is PROJECT-owned (create-only on fork sync). FORK-owned gates live in
# .githooks/gates.d/*.conf (always distributed, so a new fork gate retrofits the
# fleet) — do NOT list a fork gate here too, or it would run twice (gap 496).
#
# event       command
pre-push      scripts/quick-dev-blast-radius-check.sh
# pre-push    scripts/check-use-server-exports.sh     # enable per repo when present
# pre-push    scripts/typecheck.sh
# pre-push    scripts/test.sh
