# .githooks/gates.d/payload-roundtrip.conf — FORK-owned gate drop-in (STD-HOOKACTIVATE-001).
#
# Tier C invocation trigger for the cross-service round-trip contract
# (webhook-contract-check step-05 + deployment-to-prod §1B): warns at pre-push
# when the outgoing range touches the repo's DECLARED sender payload-builder
# paths. OPT-IN per project: silent unless .githooks/payload-builder-paths.conf
# exists (shell-case globs, one per line) — so it is a no-op on non-sender repos.
# Permanently WARN-only by design (a round-trip cannot be machine-verified at
# push time; a hard gate would fake a check). Fork gates register here (not in
# the project-owned gates.conf) so this retrofits the fleet through sync alone.
#
# event       command
pre-push      .githooks/check-payload-roundtrip.sh   # cross-service payload round-trip reminder (opt-in, WARN-only)
