# .githooks/gates.d/runbook-frontmatter.conf — FORK-owned gate drop-in (STD-HOOKACTIVATE-001).
#
# Fork gates register HERE (not in the project-owned gates.conf) so a new fork
# gate retrofits the whole fleet through sync alone — gates.d/*.conf is always
# distributed, whereas gates.conf is create-only to protect per-repo gate choices.
# Same format: <event>\t<command-relative-to-repo-root>. A command whose script
# is ABSENT in a repo is silently skipped by the dispatcher.
#
# Validates the RUNBOOK METADATA CONTRACT (status/executor/owner/last_reviewed/
# version frontmatter on operator runbooks / agent briefs). OPT-IN per project:
# the script is a SILENT NO-OP unless the repo declares its runbook locations in
# .githooks/runbook-paths.conf (shell-case globs, one per line) — so it is inert
# on every repo that hasn't opted in. Opting in is deliberate: a repo whose
# runbooks use a different frontmatter schema (e.g. name/description) must
# reconcile that schema FIRST. Origin: comms_dashboard docs/cases/tfp-fba-outbound.
#
# BLOCK on shape violations in frontmattered files; WARN on a newly added
# frontmatter-less runbook; silent otherwise. Override: git commit --no-verify.
#
# event       command
pre-commit    .githooks/check-runbook-frontmatter.sh   # runbook metadata contract (opt-in via .githooks/runbook-paths.conf)
