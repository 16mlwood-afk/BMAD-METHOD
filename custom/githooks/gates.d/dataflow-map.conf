# .githooks/gates.d/dataflow-map.conf — FORK-owned gate drop-in (STD-HOOKACTIVATE-001 / STD-DATAFLOW-001).
#
# Fork gates register HERE (not the project-owned gates.conf) so this retrofits the
# whole fleet through sync alone — gates.d/*.conf is always distributed. Same format:
# <event>\t<command-relative-to-repo-root>. A script ABSENT in a repo is silently skipped.
#
# Phase-1 WARN-only: warns when a tracked cross-boundary seam (schema-server/src/schemas/,
# */webhooks/*) changes without a matching docs/data-flows.md update. It exits 0 (never
# blocks) until a project sets `dataflow.mode: gate` in _bmad/bmm/config.yaml — promote
# warn→gate only once the false-positive rate is proven low (warn-then-gate).
#
# event       command
pre-commit    .githooks/check-dataflow-map.sh   # STD-DATAFLOW-001 seam<->map correspondence (Phase-1 WARN-only)
