# .githooks/gates.d/claude-md-shape.conf — FORK-owned gate drop-in (STD-HOOKACTIVATE-001).
#
# Fork gates register HERE (not in the project-owned gates.conf) so a new fork gate retrofits the
# whole fleet through sync alone. Same format: <event>\t<command-relative-to-repo-root>.
#
# Commit-time check on a project's root CLAUDE.md against the owner's approved shape (ruling 10 Nov 2026).
# ENABLED BY DEFAULT: a drop-in is always distributed, and the script is inert unless CLAUDE.md is staged.
#   - file has a "Swept on <date>" line  -> ENFORCED, a failure refuses the commit
#   - file has no such line              -> one warning, never refuses
#   - ~/.claude/CLAUDE.md or the checker unreadable -> "COULD NOT CHECK" printed, commit allowed
# The rules live in ~/.claude/scripts/claude-md-sweep/claude-md-tag-check.py; the gate only calls it.
# Override (logged): CLAUDE_MD_PROJECT_SHAPE_OVERRIDE="<why, 12+ chars>" git commit ...
#
# event       command
pre-commit    .githooks/check-claude-md-shape.sh   # project CLAUDE.md shape (enforced when swept, warn when not)
